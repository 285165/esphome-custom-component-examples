external_components:
  - source:
      type: git
      url: https://github.com/285165/esphome-custom-component-examples
      path: esphome/components
      ref: master
    components:
      - m5stack_8encoder
    refresh: 0s

m5stack_8encoder:
  id: encoder8
  address: 0x41
  update_interval: 200ms

  encoders:
    - number: 0
      name: "CH1"

    - number: 1
      name: "CH2"

    - number: 2
      name: "CH3"

    - number: 3
      name: "CH4"

    - number: 4
      name: "CH5"

    - number: 5
      name: "CH6"

    - number: 6
      name: "CH7"

    - number: 7
      name: "CH8"

  buttons:
    - number: 0
      name: "CH1 Button"
      pressed_value: 0

    - number: 1
      name: "CH2 Button"
      pressed_value: 0

    - number: 2
      name: "CH3 Button"
      pressed_value: 0

    - number: 3
      name: "CH4 Button"
      pressed_value: 0

    - number: 4
      name: "CH5 Button"
      pressed_value: 0

    - number: 5
      name: "CH6 Button"
      pressed_value: 0

    - number: 6
      name: "CH7 Button"
      pressed_value: 0

    - number: 7
      name: "CH8 Button"
      pressed_value: 0

  sw:
    name: "SW"

  reset_all:
    name: "Reset CH1-CH8"
    
light:
  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 0
    name: "CH1 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 1
    name: "CH2 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 2
    name: "CH3 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 3
    name: "CH4 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 4
    name: "CH5 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 5
    name: "CH6 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 6
    name: "CH7 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 7
    name: "CH8 LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: m5stack_8encoder
    m5stack_8encoder_id: encoder8
    number: 8
    name: "SW LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s